<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Library | PLSP Eng'g Insights Repository</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/library.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>
<nav class="navbar navbar-dark container">
    <a class="navbar-brand" href="/index">PLSP Eng'g Insights Repository</a>

    <div class="ms-auto d-flex align-items-center gap-4">
        <a href="/index" class="text-dim small text-decoration-none">Home</a>
        <a href="/about" class="text-dim small text-decoration-none">About</a>
        <a href="/admin" class="instructor-link text-dim small text-decoration-none" style="display: none;">Admin</a>
        <a href="/portalaccess" class="guest-only btn-portalaccess text-decoration-none">Portal Access</a>
        <a href="#" onclick="logoutUser()" class="logout-link text-dim small text-decoration-none" style="display: none; color: #ff4d4d;">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
    </div>
</nav>
    
<main class="admin-wrapper">
    <header class="admin-header-centered">
        <h1>Resource Library</h1>
        <p>Manage, update, or remove engineering materials from the repository.</p>
    </header>

    <section class="library-container">
        <div class="library-list-wrapper" id="library-list">
            <div class="text-center text-dim py-5">
                <i class="fas fa-spinner fa-spin fa-2x mb-3"></i>
                <p>Loading your resources...</p>
            </div>
        </div>
    </section>
</main>

<a href="/admin" class="btn-back">
    <i class="fa-solid fa-chevron-left"></i> Back to Dashboard
</a>

<div id="status-msg" style="display:none; position: fixed; bottom: 20px; right: 20px; z-index: 1000;" class="alert"></div>

<script src="/js/mgmt.js"></script>
<script src="/js/library.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
