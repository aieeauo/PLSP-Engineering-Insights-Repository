<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resource | PLSP Eng'g Insights</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css\upload.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>
    <nav class="navbar navbar-dark container">
    <a class="navbar-brand" href="/index.html">PLSP Eng'g Insights Repository</a>

    <div class="ms-auto d-flex align-items-center gap-4">
        <a href="/index.html" class="text-dim small text-decoration-none">Home</a>
        <a href="/about.html" class="text-dim small text-decoration-none">About</a>
        <a href="/admin.html" class="instructor-link text-dim small text-decoration-none" style="display: none;">Admin</a>
        <a href="/portalaccess.html" class="guest-only btn-portalaccess text-decoration-none">Portal Access</a>
        <a href="#" onclick="logoutUser()" class="logout-link text-dim small text-decoration-none" style="display: none; color: #ff4d4d;">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
    </div>
</nav>

<main class="admin-wrapper">
    <header class="admin-header-centered">
        <h1>Upload New Resource</h1>
        <p>Add PDF modules or video lectures to the PLSP Engineering Repository.</p>
    </header>

    <section class="upload-section">
        <form class="upload-form" id="uploadForm">
            <div class="drop-zone" id="drop-zone">
                <div id="drop-zone-prompt">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <p>Drag and drop your file here or 
                        <label for="file-upload" style="color: #ffcc00; cursor: pointer; text-decoration: underline;">Browse</label>
                    </p>
                    
                    <input type="file" id="file-upload" name="file" accept=".pdf, .mp4, .mkv, .mov" required 
                        style="opacity: 0; position: absolute; z-index: -1;">
                    <small style="display: block; margin-top: 10px;">Allowed: PDF (25MB), Video (500MB)</small>
                </div>
    
                <div id="file-info" style="display: none;">
                    <i class="fa-solid fa-file-circle-check" style="color: #ffcc00;"></i>
                    <p id="file-name" style="margin: 10px 0; font-weight: bold;"></p>
                    <button type="button" onclick="clearFile(event)" class="btn-remove">Remove File</button>
                </div>
            </div>

            <div id="progress-container" style="display: none; width: 100%; background: #222; border-radius: 5px; margin-bottom: 20px;">
                <div id="progress-bar" style="width: 0%; height: 10px; background: #ffcc00; border-radius: 5px; transition: width 0.3s;"></div>
            </div>

            <div class="form-grid">
                <div class="input-group">
                    <label>Resource Title</label>
                    <input type="text" id="resource-title" placeholder="e.g., Logic Circuit Design Part 1" required>
                </div>

                <div class="input-group">
                    <label>Resource Type</label>
                    <select class="portal-select" id="resource-type"> 
                        <option value="pdf">PDF Module</option>
                        <option value="video">Video Lecture</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Description</label>
                    <textarea id="resource-desc" rows="4"></textarea> 
                </div>

                <button type="submit" class="btn-publish" id="publishBtn" style="width: 100%;">Publish to Repository</button>
            </div>
        </form>
    </section>
</main>

<a href="/admin.html" class="btn-back">
    <i class="fa-solid fa-chevron-left"></i> Back to Dashboard
</a>

<div id="status-msg" style="display: none; text-align: center; margin-top: 15px; padding: 10px; border-radius: 5px;"></div>

<script src="/js/mgmt.js"></script>
<script src="/js/upload.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
