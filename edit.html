<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Resource | PLSP Eng'g Insights Repository</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/edit.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>
    <nav class="navbar navbar-dark container">
    <a class="navbar-brand" href="/index.html">PLSP Eng'g Insights Repository</a>

    <div class="ms-auto d-flex align-items-center gap-4">
        <a href="/index.html" class="text-dim small text-decoration-none">Home</a>
        <a href="/about.html" class="text-dim small text-decoration-none">About</a>
        <a href="/admin.html" class="instructor-link text-dim small text-decoration-none" style="display: none;">Admin</a>
        <a href="/portalaccess.html" class="guest-only btn-portalaccess text-decoration-none">Portal Access</a>
        <a href="#" onclick="logoutUser()" class="logout-link text-dim small text-decoration-none" style="display: none; color: #ff4d4d;">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
    </div>
</nav>

<main class="admin-wrapper">
    <header class="admin-header-centered">
        <h1>Edit Resource</h1>
        <p>Update the information for this module below.</p>
    </header>

    <section class="upload-section">
        <form class="upload-form" id="editResourceForm">
            <input type="hidden" id="resourceId">

            <div class="drop-zone mb-4" id="drop-zone">
                <div id="file-preview-state" class="text-center" style="display: none;">
                    <div class="file-icon-wrapper mb-3">
                        <i class="fa-solid fa-file-pdf text-warning" id="preview-icon" style="font-size: 3rem;"></i>
                    </div>
                    <p class="file-name text-white mb-2" id="preview-file-name">filename.pdf</p>
                    <button type="button" class="btn-remove-file" id="btn-remove-file" onclick="removeExistingFile(event)">
                        Remove File
                    </button>
                </div>

                <div id="file-upload-state" class="text-center">
                    <i class="fa-solid fa-cloud-arrow-up text-dim mb-3" style="font-size: 2.5rem;"></i>
                    <p class="text-dim">
                        Drag and drop your file here or 
                        <label for="fileInput" class="text-warning" style="cursor: pointer; text-decoration: underline;">
                            Browse
                        </label>
                        <input type="file" id="fileInput" name="file" accept=".pdf, .mp4, .mkv, .mov" style="display: none;" onchange="handleNewFileSelected(this)">
                    </p>
                    <small>Allowed: PDF (25MB), Video (500MB)</small>
                </div>
            </div>

            <div class="form-grid">
                <div class="input-group">
                    <label>Resource Title</label>
                    <input type="text" id="resourceTitle" placeholder="e.g., Logic Circuit Design Part 1" required>
                </div>

                <div class="input-group">
                    <label>Resource Type</label>
                    <select class="portal-select" id="resourceType"> 
                        <option value="pdf">PDF Module</option>
                        <option value="video">Video Lecture</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Description</label>
                    <textarea id="resourceDescription" rows="4"></textarea> 
                </div>

                <button type="submit" class="btn-publish" id="updateBtn" style="width: 100%;">Save Changes</button>
            </div>
        </form>
    </section>
</main>

<a href="/library.html" class="btn-back"><i class="fa-solid fa-chevron-left"></i> Back to Library</a>

<div id="status-msg" style="display: none; text-align: center; margin-top: 15px; padding: 10px; border-radius: 5px;"></div>

<script src="/js/mgmt.js"></script>
<script src="/js/edit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
