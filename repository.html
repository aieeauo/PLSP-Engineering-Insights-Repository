<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository | PLSP Eng'g Insights</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css\repository.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>
    <nav class="navbar navbar-dark container">
    <a class="navbar-brand" href="/index.html">PLSP Eng'g Insights Repository</a>

    <div class="ms-auto d-flex align-items-center gap-4">
        <a href="/index.html" class="text-dim small text-decoration-none">Home</a>
        <a href="/about.html" class="text-dim small text-decoration-none">About</a>
        <a href="/admin.html" class="instructor-link text-dim small text-decoration-none" style="display: none;">Admin</a>
        <a href="/portalaccess.html" class="guest-only btn-portalaccess text-decoration-none">Portal Access</a>
        <a href="#" onclick="logoutUser()" class="logout-link text-dim small text-decoration-none" style="display: none; color: #ff4d4d;">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
    </div>
</nav>

    <main class="repo-container container mt-5">
        <header class="repo-header text-center mb-5">
            <h1>Engineering Insights</h1>
            <p>Your central hub for PLSP Engineering resources and modules.</p>
            
            <div class="search-section">
                <div class="search-bar-container">
                    <input type="text" 
                           id="repoSearch" 
                           class="repo-search" 
                           placeholder="Search modules..." 
                           oninput="filterResources()">
                    
                    <select id="resourceFilter" class="filter-dropdown" onchange="filterResources()">
                        <option value="all">All Resources</option>
                        <option value="video">Videos</option>
                        <option value="pdf">PDFs</option>
                    </select>
                </div>
            </div>

            <div class="container mt-4">
                <div class="row justify-content-center" id="insightsGrid">
                    <div class="text-center text-dim py-5">
                        <i class="fas fa-circle-notch fa-spin fa-2x mb-3"></i>
                        <p>Loading the repository...</p>
                    </div>
                </div>
            </div>

            <div class="pagination-container mt-5">
                <div id="paginationButtons" class="pagination-wrapper">
                    </div>
            </div>
        </header>

    <div class="modal fade" id="videoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="videoModalLabel">Engineering Lecture</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" onclick="stopVideo()"></button>
                </div>

                <div class="modal-body p-0">
                    <div class="video-container">
                        <div class="ratio ratio-16x9">
                            <video id="modalVideoPlayer" controls controlsList="nodownload">
                            </video>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="/js/mgmt.js"></script>
<script src="/js/repository.js"></script>
<script src="/js/homepage.js"></script> 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
